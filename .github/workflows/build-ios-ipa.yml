name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 & Export Templates
        run: |
          set -euo pipefail
          GODOT_TAG="4.7.2-stable"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"

          curl -fSL -o /tmp/godot_macos.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          unzip -q /tmp/godot_macos.zip -d /tmp/godot_bin
          chmod +x /tmp/godot_bin/Godot.app/Contents/MacOS/Godot
          sudo ln -sf /tmp/godot_bin/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

          curl -fSL -o /tmp/godot_templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_tpl
          mkdir -p "$TEMPLATE_DIR"
          mv /tmp/godot_tpl/templates/* "$TEMPLATE_DIR/"

          rm -rf /tmp/godot_macos.zip /tmp/godot_templates.tpz /tmp/godot_tpl
          godot --version

      - name: Import Godot Project Resources
        run: godot --headless --path . --import

      - name: Export iOS Xcode Project
        run: |
          mkdir -p builds/ios
          godot --headless --path . --export-release "iOS" builds/ios/AlAzhari.xcodeproj

      - name: Build Unsigned .app & Package IPA
        run: |
          set -euo pipefail
          cd builds/ios
          xcodebuild -project AlAzhari.xcodeproj \
            -scheme AlAzhari \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr AlAzhari-unsigned.ipa Payload
          ls -lh AlAzhari-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlAzhari-unsigned-ipa
          path: builds/ios/AlAzhari-unsigned.ipa
          if-no-files-found: error
